name: Release Windows package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v1.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use the vMAJOR.MINOR.PATCH format. Received: $env:RELEASE_TAG"
          }

          $package = Get-Content -Raw -Encoding UTF8 package.json | ConvertFrom-Json
          $tagVersion = $env:RELEASE_TAG.Substring(1)
          if ($package.version -ne $tagVersion) {
            throw "package.json version $($package.version) does not match tag $env:RELEASE_TAG"
          }
          if ($package.build.buildVersion -ne $tagVersion) {
            throw "Electron buildVersion $($package.build.buildVersion) does not match tag $env:RELEASE_TAG"
          }

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run tests
        run: npm test -- --run

      - name: Build Windows application
        run: npm run dist:win

      - name: Create release archive and checksum
        shell: pwsh
        run: |
          $archive = "InkSight-$($env:RELEASE_TAG)-windows-x64.zip"
          Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath $archive -CompressionLevel Optimal

          $checksum = "$archive.sha256"
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText($checksum, "$hash  $archive`n", [System.Text.UTF8Encoding]::new($false))

          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "RELEASE_ARCHIVE=$archive`n", $utf8NoBom)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "RELEASE_CHECKSUM=$checksum`n", $utf8NoBom)

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG `
            $env:RELEASE_ARCHIVE `
            $env:RELEASE_CHECKSUM `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "InkSight $env:RELEASE_TAG" `
            --generate-notes
